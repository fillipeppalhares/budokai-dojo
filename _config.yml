# Site settings
title: Budokai Dojo
email: contato@example.com # TODO: dojo contact email
description: >
  Site de divulgação do Budokai Dojo: o dojo, as aulas e as técnicas exigidas
  em cada exame de graduação de Aikido.
lang: pt-BR

baseurl: "/budokai-dojo"
url: "https://fillipeppalhares.github.io"

# Theme: https://github.com/aksakalli/jekyll-doc-theme (loaded remotely by GitHub Pages)
remote_theme: aksakalli/jekyll-doc-theme@gh-pages

# Bootswatch colour scheme (Bootstrap 3): https://bootswatch.com/3/
# cerulean cosmo custom cyborg darkly flatly journal lumen readable sandstone simplex slate solar spacelab superhero united yeti
bootwatch: flatly

# Build settings
markdown: kramdown
highlighter: rouge

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

collections:
  graduacoes:
    output: true
    permalink: /graduacoes/:name/

defaults:
  - scope:
      path: ""
      type: graduacoes
    values:
      layout: graduacao

exclude:
  - bin
  - CLAUDE.md
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
